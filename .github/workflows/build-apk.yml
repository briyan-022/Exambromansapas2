name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q .github/ExambroMansapas-EUjian1-phone-fit-no-backbar.zip -d project
          cd project
          find . -name build.gradle -o -name settings.gradle

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/ExambroMansapas2/ExambroMansapas
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExambroMansapas-APK
          path: project/ExambroMansapas2/ExambroMansapas/app/build/outputs/apk/debug/*.apk
